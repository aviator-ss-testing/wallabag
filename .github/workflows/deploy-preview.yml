# Throwaway: receives Aviator's provision/done dispatches and echoes the inputs.
name: deploy-preview
on:
  workflow_dispatch:
    inputs:
      event: {description: provision or done, required: true, type: string}
      reason: {description: why done, required: false, type: string}
      repository: {required: true, type: string}
      branch: {required: true, type: string}
      pr_number: {required: true, type: string}
      commit_sha: {required: true, type: string}
      session_id: {required: false, type: string}
      session_url: {required: false, type: string}
      preview_config: {required: false, type: string}
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ inputs.event }} reason=${{ inputs.reason }}"
          echo "repo=${{ inputs.repository }} branch=${{ inputs.branch }} pr=${{ inputs.pr_number }} sha=${{ inputs.commit_sha }}"
          echo "session=${{ inputs.session_id }} ${{ inputs.session_url }} config=${{ inputs.preview_config }}"
