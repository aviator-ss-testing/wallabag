server {
    listen 8000 default_server;
    server_name _;

    root /code/web;
    index index.php index.html;

    # Pass all requests to Symfony front controller (wallabag uses index.php)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param APP_ENV prod;
        fastcgi_param APP_DEBUG 0;
        internal;
    }

    # Built asset files (webpack output in web/build)
    location /build/ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    # Static files from web root (favicon, manifest, etc.)
    location ~* \.(ico|css|js|gif|jpe?g|png|woff2?|ttf|eot|svg)$ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    # Return 404 for other PHP files to prevent direct execution
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/wallabag_error.log;
    access_log /var/log/nginx/wallabag_access.log;
    client_max_body_size 20M;
}
